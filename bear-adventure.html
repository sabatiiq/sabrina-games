<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bear's Adventure!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    background: #5cc8ff;
    user-select: none;
    touch-action: none;
  }
  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  #hud {
    position: absolute;
    top: 12px; left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    pointer-events: none;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 12px;
  }
  .panel {
    background: rgba(255,255,255,0.9);
    border: 4px solid #ff7043;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: clamp(16px, 3vw, 24px);
    font-weight: bold;
    color: #5d4037;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  /* touch controls */
  #touchControls {
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .pad { display: flex; gap: 12px; pointer-events: auto; }
  .tbtn {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 5px solid #4e342e;
    background: rgba(255,255,255,0.7);
    font-size: 36px;
    font-weight: bold;
    color: #4e342e;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .tbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .tbtn.jump { background: rgba(255,235,59,0.85); width: 90px; height: 90px; font-size: 28px; }

  /* Overlay (start / win / lose) */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(38px, 9vw, 80px);
    color: #fff8e1;
    text-shadow: 4px 4px 0 #d84315, 8px 8px 0 rgba(0,0,0,0.2);
    margin-bottom: 12px;
  }
  #overlay p {
    font-size: clamp(18px, 3.5vw, 26px);
    margin: 6px 0;
    max-width: 600px;
    background: rgba(0,0,0,0.3);
    padding: 8px 18px;
    border-radius: 16px;
  }
  #overlay button {
    margin-top: 20px;
    font-family: inherit;
    font-size: clamp(26px, 6vw, 44px);
    background: #ffeb3b;
    color: #5d4037;
    border: 6px solid #fbc02d;
    border-radius: 30px;
    padding: 16px 44px;
    cursor: pointer;
    box-shadow: 0 6px 0 #f57f17, 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  #overlay button:hover  { transform: scale(1.05); }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #f57f17; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="panel">🍪 <span id="score">0</span> / <span id="total">0</span></div>
    <div class="panel">❤️ <span id="lives">3</span></div>
    <div class="panel">🚩 <span id="dist">0</span>m</div>
  </div>

  <div id="touchControls">
    <div class="pad">
      <button class="tbtn" id="btnLeft">◀</button>
      <button class="tbtn" id="btnRight">▶</button>
    </div>
    <div class="pad">
      <button class="tbtn jump" id="btnJump">JUMP</button>
    </div>
  </div>

  <div id="overlay">
    <h1>🐻 Bear's Adventure! 🍪</h1>
    <p>Help Bear grab all the cookies and reach the flag! 🚩</p>
    <p><strong>Arrows</strong> to move, <strong>Space</strong> or <strong>Up</strong> to jump</p>
    <p>Jump on broccoli 🥦 to squish them. Don't bump into them!</p>
    <button id="startBtn">Let's Go! 🚀</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const totalEl = document.getElementById('total');
  const livesEl = document.getElementById('lives');
  const distEl  = document.getElementById('dist');
  const touchControls = document.getElementById('touchControls');

  // Show touch controls on touch devices
  if ('ontouchstart' in window) touchControls.style.display = 'flex';

  // Game dimensions (logical) — game world is fixed height
  const W = () => canvas.width;
  const H = () => canvas.height;
  const GROUND_Y = () => H() - 80;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Physics
  const GRAVITY = 0.55;
  const JUMP_V  = -13;
  const MOVE_SPEED = 4.2;
  const FRICTION = 0.82;
  const MAX_FALL = 14;

  // Level — designed forgiving, wide platforms, easy gaps
  // Coordinates: x grows right, y grows down. Ground sits at GROUND_Y.
  let LEVEL_LEN = 3200;
  const platforms = [
    // Floating platforms (x, y-offset-from-bottom, width, height)
    { x: 280,  y: 160, w: 180, h: 24 },
    { x: 540,  y: 240, w: 160, h: 24 },
    { x: 820,  y: 160, w: 140, h: 24 },
    { x: 1080, y: 220, w: 200, h: 24 },
    { x: 1360, y: 300, w: 180, h: 24 },
    { x: 1620, y: 200, w: 160, h: 24 },
    { x: 1880, y: 280, w: 200, h: 24 },
    { x: 2180, y: 180, w: 160, h: 24 },
    { x: 2440, y: 260, w: 220, h: 24 },
    { x: 2760, y: 200, w: 160, h: 24 },
  ];

  // Pits in the ground (gaps to jump over)
  const pits = [
    { x: 720,  w: 70 },
    { x: 1280, w: 80 },
    { x: 2020, w: 90 },
    { x: 2680, w: 75 },
  ];

  // Helpers to convert a platform's "y-from-ground" to screen y
  function platTopY(p) { return GROUND_Y() - p.y - p.h; }

  let coins = [];
  let enemies = [];
  let goalX = LEVEL_LEN - 80;

  function buildEntities() {
    coins = [
      // On platforms
      { x: 320,  y: 160 + 60, taken: false },
      { x: 400,  y: 160 + 60, taken: false },
      { x: 580,  y: 240 + 60, taken: false },
      { x: 640,  y: 240 + 60, taken: false },
      { x: 860,  y: 160 + 60, taken: false },
      { x: 1140, y: 220 + 60, taken: false },
      { x: 1200, y: 220 + 60, taken: false },
      { x: 1400, y: 300 + 60, taken: false },
      { x: 1670, y: 200 + 60, taken: false },
      { x: 1930, y: 280 + 60, taken: false },
      { x: 2220, y: 180 + 60, taken: false },
      { x: 2500, y: 260 + 60, taken: false },
      { x: 2580, y: 260 + 60, taken: false },
      { x: 2800, y: 200 + 60, taken: false },
      // On the ground
      { x: 480,  y: 60, taken: false },
      { x: 1500, y: 60, taken: false },
      { x: 2350, y: 60, taken: false },
    ];
    enemies = [
      { x: 600,  vx: -0.8, alive: true, minX: 540, maxX: 760 },
      { x: 1150, vx:  1.0, alive: true, minX: 1080, maxX: 1280 },
      { x: 1700, vx: -1.0, alive: true, minX: 1620, maxX: 1780 },
      { x: 2300, vx:  1.0, alive: true, minX: 2150, maxX: 2400 },
    ];
  }

  // Player
  const player = {
    x: 60, y: 0, vx: 0, vy: 0,
    w: 44, h: 50,
    onGround: false,
    facing: 1,
    invuln: 0,
    bounceFrames: 0,
  };

  let state = {
    running: false,
    score: 0,
    lives: 3,
    cameraX: 0,
    finished: false,
  };

  const keys = { left: false, right: false, up: false };

  function bindKeys() {
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight'|| e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { keys.up = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight'|| e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
    });
    // Touch buttons
    const bindHold = (id, prop) => {
      const el = document.getElementById(id);
      const on  = e => { keys[prop] = true;  e.preventDefault(); };
      const off = e => { keys[prop] = false; e.preventDefault(); };
      el.addEventListener('touchstart', on,  { passive: false });
      el.addEventListener('touchend',   off, { passive: false });
      el.addEventListener('touchcancel',off, { passive: false });
      el.addEventListener('mousedown',  on);
      el.addEventListener('mouseup',    off);
      el.addEventListener('mouseleave', off);
    };
    bindHold('btnLeft',  'left');
    bindHold('btnRight', 'right');
    bindHold('btnJump',  'up');
  }

  // Audio — tiny tones via WebAudio, no files needed
  let audioCtx = null;
  function beep(freq, dur, type = 'square', vol = 0.15) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    jump:  () => beep(520, 0.12, 'square'),
    coin:  () => { beep(880, 0.08); setTimeout(() => beep(1320, 0.12), 80); },
    stomp: () => beep(160, 0.18, 'sawtooth'),
    hurt:  () => beep(120, 0.4, 'sawtooth', 0.2),
    win:   () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.2), i*150)); },
  };

  // Pit check — is x position over a pit?
  function isOverPit(x) {
    for (const p of pits) {
      if (x >= p.x && x <= p.x + p.w) return true;
    }
    return false;
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    if (!state.running) return;

    // Horizontal input
    if (keys.left)  { player.vx -= 0.6; player.facing = -1; }
    if (keys.right) { player.vx += 0.6; player.facing = 1; }
    player.vx = Math.max(-MOVE_SPEED, Math.min(MOVE_SPEED, player.vx));
    if (!keys.left && !keys.right) player.vx *= FRICTION;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;

    // Jump
    if (keys.up && player.onGround) {
      player.vy = JUMP_V;
      player.onGround = false;
      sfx.jump();
    }

    // Gravity
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    // Horizontal move + collide with platforms
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x > LEVEL_LEN - player.w) player.x = LEVEL_LEN - player.w;

    const playerBox = () => ({ x: player.x, y: player.y, w: player.w, h: player.h });

    for (const p of platforms) {
      const box = { x: p.x, y: platTopY(p), w: p.w, h: p.h };
      if (rectsOverlap(playerBox(), box)) {
        // Resolve based on previous position (simple): push out horizontally
        if (player.vx > 0) player.x = box.x - player.w;
        else if (player.vx < 0) player.x = box.x + box.w;
        player.vx = 0;
      }
    }

    // Vertical move + collide with platforms / ground
    player.y += player.vy;
    player.onGround = false;

    // Platform collisions (vertical)
    for (const p of platforms) {
      const box = { x: p.x, y: platTopY(p), w: p.w, h: p.h };
      if (rectsOverlap(playerBox(), box)) {
        if (player.vy > 0) {
          player.y = box.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = box.y + box.h;
          player.vy = 0;
        }
      }
    }

    // Ground collision — only if not over a pit
    const centerX = player.x + player.w / 2;
    if (!isOverPit(centerX)) {
      if (player.y + player.h >= GROUND_Y()) {
        player.y = GROUND_Y() - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }

    // Falling into pit / off bottom of screen
    if (player.y > H() + 100) {
      loseLife();
      return;
    }

    // Coin pickups
    for (const c of coins) {
      if (c.taken) continue;
      const cb = { x: c.x - 14, y: GROUND_Y() - c.y - 28, w: 28, h: 28 };
      if (rectsOverlap(playerBox(), cb)) {
        c.taken = true;
        state.score++;
        scoreEl.textContent = state.score;
        sfx.coin();
      }
    }

    // Enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      e.x += e.vx;
      if (e.x < e.minX) { e.x = e.minX; e.vx *= -1; }
      if (e.x > e.maxX) { e.x = e.maxX; e.vx *= -1; }
      const eb = { x: e.x - 22, y: GROUND_Y() - 44, w: 44, h: 44 };
      if (player.invuln <= 0 && rectsOverlap(playerBox(), eb)) {
        // Stomp if falling onto enemy
        if (player.vy > 0 && player.y + player.h - eb.y < 24) {
          e.alive = false;
          player.vy = JUMP_V * 0.75;
          sfx.stomp();
        } else {
          loseLife();
          return;
        }
      }
    }

    if (player.invuln > 0) player.invuln--;

    // Goal!
    if (player.x + player.w >= goalX) {
      win();
      return;
    }

    // Camera follows player
    state.cameraX = Math.max(0, Math.min(LEVEL_LEN - W(), player.x - W() / 2 + player.w / 2));

    // HUD
    const dist = Math.max(0, Math.floor((player.x / LEVEL_LEN) * 100));
    distEl.textContent = dist;
  }

  function loseLife() {
    state.lives--;
    livesEl.textContent = state.lives;
    sfx.hurt();
    if (state.lives <= 0) {
      gameOver(false);
    } else {
      // Reset to start with brief invulnerability
      player.x = 60;
      player.y = GROUND_Y() - player.h - 100;
      player.vx = 0; player.vy = 0;
      player.invuln = 60;
    }
  }

  function win() {
    state.running = false;
    sfx.win();
    showOverlay(`
      <h1>🎉 You Did It! 🎉</h1>
      <p>You collected <strong>${state.score}</strong> cookies! 🍪</p>
      <p>${state.score === coins.length ? '⭐ Perfect! All cookies! ⭐' : ''}</p>
      <button id="startBtn">Play Again 🚀</button>
    `);
  }

  function gameOver() {
    state.running = false;
    showOverlay(`
      <h1>Oh no! Try again!</h1>
      <p>You got <strong>${state.score}</strong> cookies. 🍪</p>
      <button id="startBtn">Try Again 💪</button>
    `);
  }

  function showOverlay(html) {
    overlay.innerHTML = html;
    overlay.classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', start);
  }

  // ----- RENDERING -----
  function render() {
    // Sky gradient background
    const grd = ctx.createLinearGradient(0, 0, 0, H());
    grd.addColorStop(0, '#87ceeb');
    grd.addColorStop(0.7, '#b8e6f5');
    grd.addColorStop(1, '#fff3c4');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W(), H());

    // Parallax clouds + hills
    drawClouds();
    drawHills();

    ctx.save();
    ctx.translate(-state.cameraX, 0);

    // Ground
    drawGround();

    // Platforms
    for (const p of platforms) {
      drawPlatform(p.x, platTopY(p), p.w, p.h);
    }

    // Coins
    for (const c of coins) {
      if (c.taken) continue;
      drawCoin(c.x, GROUND_Y() - c.y);
    }

    // Enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      drawEnemy(e.x, GROUND_Y());
    }

    // Goal flag
    drawFlag(goalX, GROUND_Y());

    // Player
    drawPlayer();

    ctx.restore();
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const offset = state.cameraX * 0.2;
    const clouds = [
      [100, 80, 80], [400, 60, 100], [700, 100, 70],
      [1000, 70, 90], [1300, 90, 80], [1600, 60, 100],
    ];
    for (const [x, y, r] of clouds) {
      const cx = ((x - offset) % (W() + 300) + W() + 300) % (W() + 300) - 150;
      ctx.beginPath();
      ctx.arc(cx, y, r * 0.4, 0, Math.PI*2);
      ctx.arc(cx + r*0.3, y - r*0.1, r*0.45, 0, Math.PI*2);
      ctx.arc(cx + r*0.6, y, r*0.4, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawHills() {
    ctx.fillStyle = '#6ab04c';
    const offset = state.cameraX * 0.4;
    for (let i = 0; i < 8; i++) {
      const x = i * 400 - (offset % 400);
      ctx.beginPath();
      ctx.arc(x, GROUND_Y() + 20, 180, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawGround() {
    // green top
    ctx.fillStyle = '#8bc34a';
    ctx.fillRect(0, GROUND_Y(), LEVEL_LEN, 20);
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(0, GROUND_Y() + 20, LEVEL_LEN, H() - GROUND_Y());
    // Cut out pits
    for (const p of pits) {
      ctx.clearRect(p.x, GROUND_Y(), p.w, H() - GROUND_Y());
    }
  }

  function drawPlatform(x, y, w, h) {
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#a1887f';
    ctx.fillRect(x, y, w, 6);
    // stitched plank lines
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    for (let i = 20; i < w; i += 30) {
      ctx.beginPath();
      ctx.moveTo(x + i, y + 6);
      ctx.lineTo(x + i, y + h);
      ctx.stroke();
    }
  }

  function drawCoin(x, y) {
    // Spinning effect via simple animation
    const t = Date.now() / 200;
    const wob = Math.sin(t + x * 0.01) * 4;
    ctx.font = '32px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍪', x, y + wob);
  }

  function drawEnemy(x, y) {
    ctx.font = '40px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('🥦', x, y - 4);
  }

  function drawFlag(x, y) {
    // Pole
    ctx.fillStyle = '#bdbdbd';
    ctx.fillRect(x, y - 130, 6, 130);
    // Flag emoji at top
    ctx.font = '48px serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('🚩', x + 6, y - 130);
  }

  function drawPlayer() {
    const x = player.x + player.w / 2;
    const y = player.y + player.h;
    ctx.save();
    if (player.invuln > 0 && Math.floor(player.invuln / 6) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }
    ctx.font = '52px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    if (player.facing === -1) {
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      ctx.fillText('🐻', 0, 0);
    } else {
      ctx.fillText('🐻', x, y);
    }
    ctx.restore();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  function start() {
    overlay.classList.add('hidden');
    state.running = true;
    state.score = 0;
    state.lives = 3;
    state.cameraX = 0;
    buildEntities();
    totalEl.textContent = coins.length;
    scoreEl.textContent = 0;
    livesEl.textContent = 3;
    player.x = 60;
    player.y = GROUND_Y() - player.h - 100;
    player.vx = 0;
    player.vy = 0;
    player.invuln = 30;
    player.facing = 1;
    // Resume audio context on user gesture
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  bindKeys();
  document.getElementById('startBtn').addEventListener('click', start);
  buildEntities();
  totalEl.textContent = coins.length;
  loop();
})();
</script>
</body>
</html>
