<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Muffin Bakery! 🧁</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    background: linear-gradient(135deg, #fceabb 0%, #f8b6c8 55%, #b5d8ff 100%);
    user-select: none;
    overflow-x: hidden;
  }
  body { padding: 16px; min-height: 100vh; }
  #app { max-width: 900px; margin: 0 auto; }

  .home {
    position: fixed; top: 12px; left: 12px; z-index: 50;
    background: rgba(0,0,0,0.32); color: #fff; padding: 7px 12px;
    text-decoration: none; border-radius: 12px; font-size: 15px;
  }

  /* HUD */
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    margin: 4px 0 12px; flex-wrap: wrap; gap: 8px; padding: 0 8px;
  }
  .badge {
    background: rgba(255,255,255,0.94); border: 4px solid #ec6a9c;
    border-radius: 30px; padding: 8px 18px;
    font-size: clamp(16px, 3vw, 24px); font-weight: bold; color: #7a3b52;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  /* Step pips */
  .pips { display: flex; gap: 8px; }
  .pip { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #ec6a9c; }
  .pip.done { background: #4caf50; border-color: #2e7d32; }
  .pip.current { background: #ffeb3b; border-color: #fbc02d; transform: scale(1.3); }

  /* Main card */
  .card {
    background: #fffaf3; border-radius: 24px;
    box-shadow: 0 0 0 6px #fff, 0 0 0 12px #ec6a9c, 0 20px 40px rgba(0,0,0,0.22);
    padding: 24px 20px; min-height: 470px; text-align: center; position: relative;
  }
  h2.title { font-size: clamp(26px, 6vw, 40px); color: #d1477b; margin-bottom: 8px; }
  .instr { font-size: clamp(19px, 4vw, 26px); color: #5d4037; margin-bottom: 16px; min-height: 30px; }

  /* Buttons — extra big for little hands */
  .btn {
    font-family: inherit; font-size: clamp(22px, 4.5vw, 32px); font-weight: bold;
    border-radius: 28px; padding: 16px 36px; cursor: pointer; border: 5px solid;
    box-shadow: 0 6px 0 rgba(0,0,0,0.2); transition: transform 0.1s; margin: 8px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn:hover  { transform: scale(1.04); }
  .btn.yellow { background: #ffeb3b; border-color: #fbc02d; color: #5d4037; }
  .btn.green  { background: #a5d6a7; border-color: #388e3c; color: #1b5e20; }
  .btn.pink   { background: #f8bbd0; border-color: #d1477b; color: #880e4f; }

  /* Step 1: ingredients */
  .recipe {
    background: #fff3e0; border: 4px dashed #ffb74d; border-radius: 18px;
    padding: 12px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  }
  .recipe-item {
    background: white; border: 3px solid #ffb74d; border-radius: 12px;
    padding: 6px 12px; font-size: clamp(17px, 3.2vw, 23px); font-weight: bold; color: #5d4037;
    display: flex; align-items: center; gap: 6px;
  }
  .recipe-item.got { background: #c8e6c9; border-color: #4caf50; color: #2e7d32; text-decoration: line-through; }

  .shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .ingredient {
    background: #fff8e1; border: 4px solid #ffb300; border-radius: 18px;
    padding: 16px 6px; cursor: pointer; font-size: clamp(42px, 8vw, 56px);
    box-shadow: 0 5px 0 #ff8f00; transition: transform 0.1s;
  }
  .ingredient:hover  { transform: scale(1.05); }
  .ingredient:active { transform: translateY(3px); box-shadow: 0 2px 0 #ff8f00; }
  .ingredient .name { display: block; font-size: clamp(14px, 2.6vw, 18px); font-weight: bold; color: #5d4037; margin-top: 4px; }
  .ingredient.used { opacity: 0.3; pointer-events: none; }
  .ingredient.shake { animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

  .bowl-area { font-size: clamp(80px, 16vw, 130px); margin: 8px 0; min-height: 130px; line-height: 1; }

  /* Step 2: mix */
  .mix-bowl { font-size: clamp(120px, 22vw, 180px); cursor: pointer; display: inline-block; transition: transform 0.1s; margin: 10px 0; }
  .mix-bowl.spinning { animation: spin 0.4s; }
  @keyframes spin { 0%{transform:rotate(0)} 50%{transform:rotate(20deg) scale(1.1)} 100%{transform:rotate(-20deg) scale(1)} }
  .progress-bar {
    background: #ffe0b2; border: 4px solid #ec6a9c; border-radius: 20px; height: 40px;
    width: 82%; max-width: 400px; margin: 16px auto; overflow: hidden; position: relative;
  }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb74d, #ec6a9c); transition: width 0.2s; }
  .progress-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #5d4037; font-size: clamp(16px,3vw,20px); }

  /* Step 3: fill cups */
  .tray {
    background: #cfd8dc; border: 6px solid #90a4ae; border-radius: 20px;
    padding: 18px; margin: 14px auto; max-width: 480px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .cup {
    background: #b0bec5; border: 4px dashed #fff; border-radius: 0 0 40% 40% / 0 0 60% 60%;
    aspect-ratio: 1 / 1.05; display: flex; align-items: center; justify-content: center;
    font-size: clamp(40px, 8vw, 60px); cursor: pointer; transition: transform 0.1s;
  }
  .cup:hover { transform: scale(1.04); }
  .cup.filled { border-style: solid; border-color: #8d6e63; background: #d7a86b; }
  .cup.filled.pop { animation: pop 0.4s; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }

  /* Step 4: bake */
  .oven { background: #455a64; border: 8px solid #263238; border-radius: 18px; padding: 18px; margin: 14px auto; max-width: 460px; }
  .oven-window {
    background: radial-gradient(circle, #ffcc80 0%, #ff7043 100%);
    border: 5px solid #1a1a1a; border-radius: 12px; padding: 18px;
    font-size: clamp(38px, 8vw, 58px); min-height: 150px;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    position: relative; overflow: hidden; transition: transform 0.4s;
  }
  .oven-window::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(45deg, transparent, rgba(255,255,200,0.35), transparent);
    animation: heat 2s linear infinite;
  }
  @keyframes heat { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  .rise { display: inline-block; transition: transform 0.6s, font-size 0.6s; }

  /* Step 5: decorate */
  .toppings { display: flex; justify-content: center; gap: 14px; margin: 14px 0; flex-wrap: wrap; }
  .topping {
    background: #fff8e1; border: 4px solid #ffb300; border-radius: 18px; padding: 12px 16px;
    cursor: pointer; font-size: clamp(32px, 6vw, 46px); box-shadow: 0 5px 0 #ef6c00; transition: transform 0.1s;
  }
  .topping:active { transform: translateY(3px); box-shadow: 0 2px 0 #ef6c00; }
  .topping.selected { background: #fff176; border-color: #f57f17; transform: scale(1.1); box-shadow: 0 0 16px #ffeb3b; }
  .topping .name { display: block; font-size: clamp(13px, 2.5vw, 17px); font-weight: bold; color: #5d4037; }
  .muffin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 480px; margin: 14px auto; }
  .muffin {
    background: linear-gradient(#f6c07a 0 45%, #a9744f 45% 100%);
    border: 4px solid #8d6e63; border-radius: 40% 40% 24% 24% / 55% 55% 24% 24%;
    aspect-ratio: 1 / 1.05; cursor: pointer; position: relative; overflow: hidden; transition: transform 0.1s;
  }
  .muffin:hover { transform: scale(1.05); }
  .muffin .deco { position: absolute; font-size: clamp(16px,3vw,22px); pointer-events: none; animation: pop 0.3s; }

  /* End */
  .stars-big { font-size: clamp(48px, 10vw, 76px); letter-spacing: 6px; margin: 16px 0; }
  .star-anim { display: inline-block; animation: starpop 0.6s backwards; }
  @keyframes starpop { 0%{transform:scale(0) rotate(-180deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1} }

  .confetti { position: fixed; width: 12px; height: 12px; top: -20px; pointer-events: none; z-index: 100; animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="home" href="index.html">⌂ Home</a>
<div id="app">
  <div id="hud">
    <div class="badge" id="stepLabel">Welcome!</div>
    <div class="pips" id="pips"></div>
    <div class="badge">⭐ <span id="stars">0</span></div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
(() => {
  const card    = document.getElementById('card');
  const stepLbl = document.getElementById('stepLabel');
  const pipsEl  = document.getElementById('pips');
  const starsEl = document.getElementById('stars');

  const TOTAL_STEPS = 5;
  const CUPS = 6;
  let stars = 0;

  // ----- AUDIO -----
  let audioCtx = null;
  function beep(freq, dur, type='square', vol=0.15) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g).connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  const sfx = {
    plop: () => beep(440, 0.08, 'sine'),
    stir: () => beep(220 + Math.random()*200, 0.06, 'square', 0.08),
    no:   () => beep(180, 0.18, 'sawtooth'),
    ding: () => { beep(880,0.1); setTimeout(()=>beep(1320,0.18),80); },
    win:  () => { [523,659,784,1047,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.2), i*140)); },
  };

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85; u.pitch = 1.2; u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  function setPips(current) {
    pipsEl.innerHTML = '';
    for (let i = 0; i < TOTAL_STEPS; i++) {
      const p = document.createElement('div');
      p.className = 'pip' + (i < current ? ' done' : i === current ? ' current' : '');
      pipsEl.appendChild(p);
    }
  }

  function awardStar() { stars++; starsEl.textContent = stars; burstConfetti(); }

  function burstConfetti() {
    const colors = ['#ff5252','#ffeb3b','#4caf50','#2196f3','#e040fb','#ff9800','#ec6a9c'];
    for (let i = 0; i < 26; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  // ======================= WELCOME =======================
  function renderWelcome() {
    setPips(-1);
    stepLbl.textContent = 'Welcome!';
    card.innerHTML = `
      <div style="font-size: clamp(80px, 16vw, 130px);">🐻👩‍🍳🧁</div>
      <h2 class="title">Muffin Bakery!</h2>
      <p class="instr">Help Bear bake yummy blueberry muffins!</p>
      <ol style="text-align:left; max-width:360px; margin: 14px auto; font-size: clamp(18px,3.4vw,24px); color:#5d4037; line-height: 1.8;">
        <li>🥣 Add the things</li>
        <li>🥄 Mix the batter</li>
        <li>🧁 Fill the cups</li>
        <li>🔥 Bake them</li>
        <li>🫐 Add a topping!</li>
      </ol>
      <button class="btn pink" id="goBtn">Let's Bake! 🚀</button>
    `;
    document.getElementById('goBtn').addEventListener('click', () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      stars = 0; starsEl.textContent = 0;
      renderStep1();
    });
  }

  // ======================= STEP 1: INGREDIENTS =======================
  const RECIPE = [
    { id:'flour',  emoji:'🌾', name:'Flour' },
    { id:'sugar',  emoji:'🍬', name:'Sugar' },
    { id:'egg',    emoji:'🥚', name:'Egg' },
    { id:'milk',   emoji:'🥛', name:'Milk' },
    { id:'berry',  emoji:'🫐', name:'Blueberries' },
  ];
  const DECOYS = [
    { id:'broccoli', emoji:'🥦', name:'Broccoli' },
    { id:'boot',     emoji:'🥾', name:'Boot' },
  ];

  function renderStep1() {
    setPips(0);
    stepLbl.textContent = 'Step 1 of 5';
    speak("Step one! Tap the things that go in muffins.");
    const need = new Set(RECIPE.map(r => r.id));
    const added = new Set();
    const all = [...RECIPE, ...DECOYS].sort(() => Math.random() - 0.5);

    card.innerHTML = `
      <h2 class="title">🥣 Add the Things!</h2>
      <p class="instr">Tap what goes in muffins.<br>Skip the silly ones!</p>
      <div class="recipe" id="recipe"></div>
      <div class="bowl-area" id="bowl">🥣</div>
      <div class="shelf" id="shelf"></div>
    `;

    const recipeEl = document.getElementById('recipe');
    RECIPE.forEach(r => {
      const el = document.createElement('div');
      el.className = 'recipe-item';
      el.id = 'r-' + r.id;
      el.innerHTML = `${r.emoji} ${r.name}`;
      recipeEl.appendChild(el);
    });

    const shelfEl = document.getElementById('shelf');
    const bowlEl = document.getElementById('bowl');
    all.forEach(item => {
      const el = document.createElement('div');
      el.className = 'ingredient';
      el.innerHTML = `${item.emoji}<span class="name">${item.name}</span>`;
      el.addEventListener('click', () => {
        if (need.has(item.id) && !added.has(item.id)) {
          added.add(item.id);
          el.classList.add('used');
          document.getElementById('r-' + item.id).classList.add('got');
          bowlEl.textContent = '🥣 ' + Array.from(added).map(id => {
            const r = RECIPE.find(x => x.id === id); return r ? r.emoji : '';
          }).join('');
          sfx.plop();
          speak(item.name);
          if (added.size === RECIPE.length) {
            awardStar();
            speak("Yay! Everything is in the bowl!");
            setTimeout(renderStep2, 1100);
          }
        } else if (!added.has(item.id)) {
          el.classList.add('shake');
          setTimeout(() => el.classList.remove('shake'), 400);
          sfx.no();
          speak("Silly! That doesn't go in muffins!");
        }
      });
      shelfEl.appendChild(el);
    });
  }

  // ======================= STEP 2: MIX =======================
  function renderStep2() {
    setPips(1);
    stepLbl.textContent = 'Step 2 of 5';
    speak("Step two! Tap the bowl to mix the batter!");
    card.innerHTML = `
      <h2 class="title">🥄 Mix the Batter!</h2>
      <p class="instr">Tap the bowl to stir!</p>
      <div class="mix-bowl" id="mixBowl">🥣🥄</div>
      <div class="progress-bar">
        <div class="progress-fill" id="mixFill"></div>
        <div class="progress-label" id="mixLabel">Tap to mix!</div>
      </div>
    `;
    const bowl = document.getElementById('mixBowl');
    const fill = document.getElementById('mixFill');
    const label = document.getElementById('mixLabel');
    let count = 0;
    const TARGET = 12;
    bowl.addEventListener('click', () => {
      if (count >= TARGET) return;
      count++;
      fill.style.width = Math.min(100, (count / TARGET) * 100) + '%';
      bowl.classList.remove('spinning'); void bowl.offsetWidth; bowl.classList.add('spinning');
      sfx.stir();
      if (count < TARGET) {
        label.textContent = count < 5 ? 'Keep mixing!' : count < 9 ? 'Looking yummy!' : 'Almost there!';
      } else {
        label.textContent = '✨ Batter is ready! ✨';
        awardStar();
        speak("The batter is ready!");
        setTimeout(renderStep3, 1000);
      }
    });
  }

  // ======================= STEP 3: FILL CUPS =======================
  function renderStep3() {
    setPips(2);
    stepLbl.textContent = 'Step 3 of 5';
    speak("Step three! Tap each cup to fill it with batter.");
    const filled = Array(CUPS).fill(false);
    card.innerHTML = `
      <h2 class="title">🧁 Fill the Cups!</h2>
      <p class="instr">Tap each cup to pour the batter!</p>
      <div class="tray" id="tray"></div>
      <p style="color:#5d4037; font-weight:bold; font-size: clamp(17px,3.2vw,23px);">
        <span id="fillCount">0</span> of ${CUPS} cups filled
      </p>
    `;
    const tray = document.getElementById('tray');
    const countEl = document.getElementById('fillCount');
    for (let i = 0; i < CUPS; i++) {
      const cup = document.createElement('div');
      cup.className = 'cup';
      cup.addEventListener('click', () => {
        if (filled[i]) return;
        filled[i] = true;
        cup.classList.add('filled', 'pop');
        cup.textContent = '🥣';
        sfx.plop();
        const n = filled.filter(Boolean).length;
        countEl.textContent = n;
        if (n === CUPS) {
          awardStar();
          speak("All cups are full! Time to bake!");
          setTimeout(renderStep4, 1000);
        }
      });
      tray.appendChild(cup);
    }
  }

  // ======================= STEP 4: BAKE =======================
  function renderStep4() {
    setPips(3);
    stepLbl.textContent = 'Step 4 of 5';
    speak("Step four! Tap the oven to bake the muffins!");
    card.innerHTML = `
      <h2 class="title">🔥 Bake the Muffins!</h2>
      <p class="instr">Tap the oven to turn it on!</p>
      <div class="oven">
        <div class="oven-window" id="ovenWin">${'🥣'.repeat(CUPS)}</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="bakeFill"></div>
        <div class="progress-label" id="bakeLabel">Tap the oven!</div>
      </div>
      <button class="btn green" id="bakeBtn">Turn On Oven 🔛</button>
    `;
    const win = document.getElementById('ovenWin');
    const fill = document.getElementById('bakeFill');
    const label = document.getElementById('bakeLabel');
    const btn = document.getElementById('bakeBtn');
    let baking = false;

    function startBake() {
      if (baking) return;
      baking = true;
      btn.remove();
      speak("The muffins are baking! Watch them rise!");
      let pct = 0;
      const timer = setInterval(() => {
        pct += 5;
        fill.style.width = pct + '%';
        // muffins grow and turn golden as they bake
        win.style.transform = `scale(${1 + (pct/100) * 0.12})`;
        if (pct >= 40) win.innerHTML = '🧁'.repeat(CUPS);
        label.textContent = pct < 50 ? 'Rising...' : pct < 100 ? 'Almost done!' : '';
        if (pct >= 100) {
          clearInterval(timer);
          sfx.ding();
          label.textContent = '🔔 Ding! All done!';
          win.innerHTML = '🧁'.repeat(CUPS);
          awardStar();
          speak("Ding! The muffins are ready!");
          setTimeout(renderStep5, 1400);
        }
      }, 180);
    }

    btn.addEventListener('click', startBake);
    document.querySelector('.oven').addEventListener('click', startBake);
  }

  // ======================= STEP 5: DECORATE =======================
  const TOPPINGS = [
    { id:'berry',  emoji:'🫐', name:'Blueberry' },
    { id:'sugar',  emoji:'🍦', name:'Cream' },
    { id:'sprink', emoji:'🎉', name:'Sprinkles' },
    { id:'heart',  emoji:'❤️', name:'Heart' },
  ];

  function renderStep5() {
    setPips(4);
    stepLbl.textContent = 'Step 5 of 5';
    speak("Last step! Pick a topping, then tap a muffin!");
    card.innerHTML = `
      <h2 class="title">🫐 Add a Topping!</h2>
      <p class="instr">Pick a topping, then tap a muffin!</p>
      <div class="toppings" id="toppings"></div>
      <div class="muffin-grid" id="muffinGrid"></div>
      <button class="btn pink" id="doneBtn">All Done! 🎁</button>
    `;
    let selected = TOPPINGS[0];
    const topEl = document.getElementById('toppings');
    TOPPINGS.forEach((t, i) => {
      const b = document.createElement('div');
      b.className = 'topping' + (i === 0 ? ' selected' : '');
      b.innerHTML = `${t.emoji}<span class="name">${t.name}</span>`;
      b.addEventListener('click', () => {
        selected = t;
        topEl.querySelectorAll('.topping').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        sfx.plop();
        speak(t.name);
      });
      topEl.appendChild(b);
    });

    const grid = document.getElementById('muffinGrid');
    for (let i = 0; i < CUPS; i++) {
      const m = document.createElement('div');
      m.className = 'muffin';
      m.addEventListener('click', () => {
        const d = document.createElement('span');
        d.className = 'deco';
        d.textContent = selected.emoji;
        const rect = m.getBoundingClientRect();
        d.style.left = (8 + Math.random() * Math.max(10, rect.width - 30)) + 'px';
        d.style.top  = (6 + Math.random() * Math.max(10, rect.height * 0.4)) + 'px';
        m.appendChild(d);
        sfx.plop();
      });
      grid.appendChild(m);
    }
    document.getElementById('doneBtn').addEventListener('click', () => {
      awardStar();
      sfx.win();
      renderEnd();
    });
  }

  // ======================= END =======================
  function renderEnd() {
    setPips(TOTAL_STEPS);
    stepLbl.textContent = 'All Done!';
    speak(`Yum yum! Thank you! You earned ${stars} stars!`);
    for (let k = 0; k < 4; k++) setTimeout(burstConfetti, k * 400);
    let starHTML = '';
    for (let i = 0; i < stars; i++) starHTML += `<span class="star-anim" style="animation-delay:${i*0.12}s">⭐</span>`;
    card.innerHTML = `
      <div style="font-size: clamp(100px, 20vw, 150px);">🐻🧁</div>
      <h2 class="title">Yum! Bear loves them!</h2>
      <p class="instr">Thank you, super baker! 👩‍🍳</p>
      <div class="stars-big">${starHTML}</div>
      <p style="font-size: clamp(20px,4vw,28px); color:#5d4037; font-weight:bold;">
        You earned <strong>${stars}</strong> stars!
      </p>
      <button class="btn pink" id="againBtn">Bake Again! 🧁</button>
    `;
    document.getElementById('againBtn').addEventListener('click', () => {
      stars = 0; starsEl.textContent = 0;
      renderWelcome();
    });
  }

  renderWelcome();
})();
</script>
</body>
</html>
