<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Storybook Adventure!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    background: linear-gradient(135deg, #ffd3a5 0%, #fd9853 50%, #ffafbd 100%);
    user-select: none;
    overflow-x: hidden;
  }
  body { padding: 20px; min-height: 100vh; }
  #app {
    max-width: 900px;
    margin: 0 auto;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 10px;
  }
  .badge {
    background: rgba(255,255,255,0.9);
    border: 4px solid #ff7043;
    border-radius: 30px;
    padding: 8px 20px;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: bold;
    color: #5d4037;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  /* The book */
  .book {
    background: #fffaf0;
    border-radius: 24px;
    box-shadow:
      0 0 0 8px #fff,
      0 0 0 14px #d84315,
      0 20px 40px rgba(0,0,0,0.3);
    padding: 30px;
    position: relative;
    min-height: 480px;
  }
  .page {
    display: none;
    animation: turnIn 0.5s ease-out;
  }
  .page.active { display: block; }
  @keyframes turnIn {
    from { opacity: 0; transform: rotateY(-30deg) translateX(40px); }
    to   { opacity: 1; transform: rotateY(0)     translateX(0); }
  }

  .scene {
    font-size: clamp(80px, 18vw, 160px);
    text-align: center;
    padding: 30px 10px;
    background: linear-gradient(180deg, #b3e5fc 0%, #fff9c4 70%, #c5e1a5 100%);
    border-radius: 20px;
    border: 4px dashed #ff9800;
    margin-bottom: 20px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sentence {
    font-size: clamp(28px, 5.5vw, 44px);
    font-weight: bold;
    color: #4e342e;
    text-align: center;
    padding: 16px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .blank {
    display: inline-block;
    min-width: 120px;
    padding: 4px 12px;
    border-bottom: 6px solid #ff7043;
    color: #d84315;
    transition: all 0.3s;
  }
  .blank.filled {
    border-bottom-color: #4caf50;
    color: #2e7d32;
    animation: bounce 0.5s;
  }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.3); }
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .choice {
    font-family: inherit;
    font-size: clamp(24px, 4.5vw, 36px);
    font-weight: bold;
    color: #4e342e;
    background: #fff3e0;
    border: 5px solid #ff9800;
    border-radius: 20px;
    padding: 18px 10px;
    cursor: pointer;
    box-shadow: 0 6px 0 #f57c00;
    transition: transform 0.1s;
  }
  .choice:hover  { transform: scale(1.05); }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 #f57c00; }
  .choice.right  { background: #c8e6c9; border-color: #4caf50; box-shadow: 0 6px 0 #2e7d32; animation: shake 0.4s; }
  .choice.wrong  { background: #ffcdd2; border-color: #e53935; box-shadow: 0 6px 0 #c62828; animation: nope 0.4s; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-5deg) scale(1.1); }
    75%      { transform: rotate(5deg)  scale(1.1); }
  }
  @keyframes nope {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-8px); }
    75%      { transform: translateX(8px); }
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: inherit;
    font-size: clamp(18px, 3.5vw, 26px);
    font-weight: bold;
    border-radius: 24px;
    padding: 12px 24px;
    cursor: pointer;
    border: 4px solid;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn.listen { background: #bbdefb; border-color: #1976d2; color: #0d47a1; }
  .btn.next   { background: #ffeb3b; border-color: #fbc02d; color: #5d4037; }
  .btn.next[disabled] { opacity: 0.4; cursor: not-allowed; }

  .feedback {
    text-align: center;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: bold;
    min-height: 40px;
    margin-bottom: 14px;
    color: #2e7d32;
  }

  /* End screen */
  #endScreen {
    display: none;
    text-align: center;
    padding: 30px;
  }
  #endScreen.show { display: block; }
  #endScreen h1 {
    font-size: clamp(40px, 8vw, 70px);
    color: #d84315;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .star-row {
    font-size: clamp(50px, 10vw, 80px);
    margin: 20px 0;
    letter-spacing: 8px;
  }
  .star-row .star {
    display: inline-block;
    animation: pop 0.6s backwards;
  }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0);       opacity: 1; }
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 12px; height: 12px;
    top: -20px;
    pointer-events: none;
    z-index: 100;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="badge">📖 Page <span id="pageNum">1</span> / <span id="pageTotal">6</span></div>
    <div class="badge">⭐ <span id="stars">0</span></div>
  </div>

  <div class="book" id="book">
    <!-- Pages get inserted here -->
    <div id="endScreen">
      <h1>🎉 You Read the Book! 🎉</h1>
      <div class="star-row" id="finalStars"></div>
      <p style="font-size: clamp(20px,4vw,28px); color:#4e342e; margin: 14px 0;">
        Great job reading, super reader!
      </p>
      <button class="btn next" id="restartBtn">Read Again 📖</button>
    </div>
  </div>
</div>

<script>
(() => {
  const pages = [
    {
      scene: '🐻',
      before: 'The bear is ',
      after: '.',
      answer: 'big',
      choices: ['big', 'tiny', 'wet'],
      hint: 'The bear is BIG!'
    },
    {
      scene: '🐻 ☀️',
      before: 'Bear sees the ',
      after: '.',
      answer: 'sun',
      choices: ['moon', 'sun', 'fish'],
      hint: 'Look up — the SUN is shining!'
    },
    {
      scene: '🐻 🏃',
      before: 'Bear can ',
      after: ' fast!',
      answer: 'run',
      choices: ['sit', 'run', 'sleep'],
      hint: 'Bear is moving — Bear can RUN!'
    },
    {
      scene: '🐻 🌳',
      before: 'Bear hugs the ',
      after: '.',
      answer: 'tree',
      choices: ['tree', 'rock', 'cake'],
      hint: 'The tall green plant is a TREE!'
    },
    {
      scene: '🐻 🍯',
      before: 'Bear eats yummy ',
      after: '.',
      answer: 'honey',
      choices: ['soap', 'honey', 'socks'],
      hint: 'Sweet and sticky — bears love HONEY!'
    },
    {
      scene: '🐻 💤',
      before: 'Bear goes to ',
      after: '.',
      answer: 'sleep',
      choices: ['sleep', 'swim', 'sing'],
      hint: 'Zzz... time to SLEEP!'
    }
  ];

  const book      = document.getElementById('book');
  const pageNumEl = document.getElementById('pageNum');
  const pageTotEl = document.getElementById('pageTotal');
  const starsEl   = document.getElementById('stars');
  const endScreen = document.getElementById('endScreen');
  const finalStars = document.getElementById('finalStars');
  const restartBtn = document.getElementById('restartBtn');

  let current = 0;
  let stars   = 0;
  let pageEls = [];
  pageTotEl.textContent = pages.length;

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1.1;
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  function buildPage(p, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'page' + (idx === 0 ? ' active' : '');

    wrap.innerHTML = `
      <div class="scene">${p.scene}</div>
      <div class="sentence">
        ${p.before}<span class="blank" data-blank>____</span>${p.after}
      </div>
      <div class="feedback" data-fb></div>
      <div class="choices" data-choices></div>
      <div class="controls">
        <button class="btn listen" data-listen>🔊 Read to me</button>
        <button class="btn next" data-next disabled>Next page ➡️</button>
      </div>
    `;

    const choicesEl = wrap.querySelector('[data-choices]');
    const blankEl   = wrap.querySelector('[data-blank]');
    const fbEl      = wrap.querySelector('[data-fb]');
    const nextBtn   = wrap.querySelector('[data-next]');
    const listenBtn = wrap.querySelector('[data-listen]');

    // shuffle choices
    const shuffled = [...p.choices].sort(() => Math.random() - 0.5);
    shuffled.forEach(word => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = word;
      b.addEventListener('click', () => {
        if (nextBtn.disabled === false) return;
        if (word === p.answer) {
          b.classList.add('right');
          blankEl.textContent = word;
          blankEl.classList.add('filled');
          fbEl.textContent = '🌟 Yay! That\'s right! 🌟';
          fbEl.style.color = '#2e7d32';
          stars++;
          starsEl.textContent = stars;
          nextBtn.disabled = false;
          // disable all choices
          choicesEl.querySelectorAll('.choice').forEach(c => c.style.pointerEvents = 'none');
          burstConfetti();
          speak(p.before + word + p.after);
        } else {
          b.classList.add('wrong');
          fbEl.textContent = '🤔 Try again! ' + p.hint;
          fbEl.style.color = '#d84315';
          setTimeout(() => b.classList.remove('wrong'), 600);
          speak('Try again!');
        }
      });
      choicesEl.appendChild(b);
    });

    listenBtn.addEventListener('click', () => {
      speak(p.before + 'blank' + p.after + '. ' + p.hint);
    });

    nextBtn.addEventListener('click', () => {
      goToPage(idx + 1);
    });

    return wrap;
  }

  function goToPage(idx) {
    pageEls.forEach(el => el.classList.remove('active'));
    if (idx >= pages.length) {
      // end screen
      endScreen.classList.add('show');
      pageNumEl.textContent = pages.length;
      finalStars.innerHTML = '';
      for (let i = 0; i < stars; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.textContent = '⭐';
        s.style.animationDelay = (i * 0.2) + 's';
        finalStars.appendChild(s);
      }
      bigCelebration();
      speak('You read the whole book! Amazing job!');
      return;
    }
    pageEls[idx].classList.add('active');
    pageNumEl.textContent = idx + 1;
    current = idx;
    // auto-read the page after a beat
    const p = pages[idx];
    setTimeout(() => speak(p.before + 'blank' + p.after), 300);
  }

  function burstConfetti() {
    const colors = ['#ff5252','#ffeb3b','#4caf50','#2196f3','#e040fb','#ff9800'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  function bigCelebration() {
    for (let k = 0; k < 4; k++) {
      setTimeout(burstConfetti, k * 400);
    }
  }

  function start() {
    // clear old pages
    pageEls.forEach(el => el.remove());
    pageEls = [];
    endScreen.classList.remove('show');
    stars = 0;
    starsEl.textContent = 0;
    pages.forEach((p, i) => {
      const el = buildPage(p, i);
      pageEls.push(el);
      book.insertBefore(el, endScreen);
    });
    goToPage(0);
  }

  restartBtn.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
