<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cupcake Unicorn Cece! 🧁🦄</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    background: linear-gradient(135deg, #fceabb 0%, #fbc2eb 55%, #c2e9fb 100%);
    user-select: none;
    overflow-x: hidden;
  }
  body { padding: 16px; min-height: 100vh; }
  #app { max-width: 760px; margin: 0 auto; }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 8px;
  }
  .badge {
    background: rgba(255,255,255,0.92);
    border: 4px solid #e040fb;
    border-radius: 30px;
    padding: 8px 18px;
    font-size: clamp(16px, 3vw, 24px);
    font-weight: bold;
    color: #6a1b9a;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  .card {
    background: #fffdf6;
    border-radius: 24px;
    box-shadow:
      0 0 0 6px #fff,
      0 0 0 12px #e040fb,
      0 20px 40px rgba(0,0,0,0.25);
    padding: 18px 16px 24px;
    text-align: center;
  }

  h1.title {
    font-size: clamp(24px, 5.5vw, 38px);
    color: #ad1457;
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 8px;
  }
  .hint {
    font-size: clamp(15px, 3vw, 20px);
    color: #6a1b9a;
    margin-bottom: 12px;
    min-height: 26px;
    font-weight: bold;
  }

  /* Tempat cupcake */
  #stage {
    position: relative;
    width: 280px;
    max-width: 80vw;
    margin: 0 auto 14px;
    aspect-ratio: 200 / 250;
    cursor: pointer;
  }
  #stage svg { width: 100%; height: 100%; display: block; }
  .deco {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 30px;
    pointer-events: none;
    animation: plop 0.25s ease-out;
  }
  @keyframes plop {
    0% { transform: translate(-50%, -50%) scale(0); }
    70%{ transform: translate(-50%, -50%) scale(1.3); }
    100%{ transform: translate(-50%, -50%) scale(1); }
  }

  /* Panel pilihan */
  .section-label {
    font-size: clamp(15px, 3vw, 19px);
    font-weight: bold;
    color: #ad1457;
    margin: 10px 0 6px;
  }
  .palette {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .swatch {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.15), 0 3px 5px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .swatch:active { transform: scale(0.9); }
  .swatch.sel { box-shadow: 0 0 0 4px #ffeb3b, 0 3px 6px rgba(0,0,0,0.3); transform: scale(1.12); }

  .tool {
    font-family: inherit;
    font-size: clamp(22px, 5vw, 30px);
    background: #f3e5f5;
    border: 4px solid #ba68c8;
    border-radius: 16px;
    width: 54px; height: 54px;
    cursor: pointer;
    box-shadow: 0 4px 0 #8e24aa;
    transition: transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #8e24aa; }
  .tool.sel { background: #ffe082; border-color: #fbc02d; box-shadow: 0 4px 0 #f57f17; transform: scale(1.08); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .btn {
    font-family: inherit;
    font-size: clamp(18px, 3.6vw, 26px);
    font-weight: bold;
    border-radius: 22px;
    padding: 12px 26px;
    cursor: pointer;
    border: 4px solid;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn.done  { background: #ffeb3b; border-color: #fbc02d; color: #6a1b9a; }
  .btn.clear { background: #b3e5fc; border-color: #039be5; color: #01579b; }
  .btn.speak { background: #c8e6c9; border-color: #43a047; color: #1b5e20; }

  /* Overlay selesai */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(74,20,140,0.6);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
    padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    font-size: clamp(30px, 7vw, 56px);
    text-shadow: 3px 3px 0 #d500f9;
    margin-bottom: 12px;
  }
  #overlay p { font-size: clamp(18px, 4vw, 26px); margin-bottom: 18px; }

  .confetti {
    position: fixed;
    width: 12px; height: 12px;
    top: -20px;
    pointer-events: none;
    z-index: 100;
    animation: fall 3s linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="badge">🧁 Cupcake dibuat: <span id="count">0</span></div>
    <div class="badge">🦄 Cece</div>
  </div>

  <div class="card">
    <h1 class="title">🧁 Cupcake Unicorn Cece! 🦄</h1>
    <div class="hint" id="hint">Pilih warna krim, lalu ketuk cupcake untuk menabur hiasan! ✨</div>

    <div id="stage" aria-label="cupcake">
      <svg viewBox="0 0 200 250">
        <!-- Tanduk unicorn -->
        <polygon points="100,8 90,58 110,58" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
        <line x1="94" y1="22" x2="106" y2="26" stroke="#f9a825" stroke-width="3"/>
        <line x1="92" y1="34" x2="108" y2="38" stroke="#f9a825" stroke-width="3"/>
        <line x1="91" y1="46" x2="109" y2="50" stroke="#f9a825" stroke-width="3"/>
        <!-- Telinga -->
        <polygon points="64,78 56,52 84,70" fill="#fff" stroke="#e1bee7" stroke-width="3"/>
        <polygon points="136,78 144,52 116,70" fill="#fff" stroke="#e1bee7" stroke-width="3"/>
        <polygon points="66,74 62,60 78,70" fill="#f8bbd0"/>
        <polygon points="134,74 138,60 122,70" fill="#f8bbd0"/>

        <!-- Krim (warna bisa diganti) -->
        <g class="frosting">
          <circle cx="100" cy="135" r="60" fill="#f48fb1"/>
          <circle cx="68"  cy="108" r="40" fill="#f48fb1"/>
          <circle cx="132" cy="108" r="40" fill="#f48fb1"/>
          <circle cx="100" cy="92"  r="36" fill="#f48fb1"/>
        </g>

        <!-- Wajah unicorn -->
        <path d="M78 112 q7 9 14 0" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
        <path d="M108 112 q7 9 14 0" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
        <circle cx="74" cy="126" r="7" fill="#ff8a80" opacity="0.7"/>
        <circle cx="126" cy="126" r="7" fill="#ff8a80" opacity="0.7"/>
        <path d="M94 124 q6 6 12 0" fill="none" stroke="#5d4037" stroke-width="3" stroke-linecap="round"/>

        <!-- Cup/wadah -->
        <path d="M58 168 L72 240 Q100 250 128 240 L142 168 Z"
              fill="#ce93d8" stroke="#8e24aa" stroke-width="3"/>
        <line x1="74" y1="174" x2="83" y2="238" stroke="#ab47bc" stroke-width="4"/>
        <line x1="92" y1="176" x2="95" y2="240" stroke="#ab47bc" stroke-width="4"/>
        <line x1="110" y1="176" x2="108" y2="240" stroke="#ab47bc" stroke-width="4"/>
        <line x1="126" y1="174" x2="118" y2="238" stroke="#ab47bc" stroke-width="4"/>
        <ellipse cx="100" cy="168" rx="42" ry="8" fill="#ba68c8" stroke="#8e24aa" stroke-width="3"/>
      </svg>
    </div>

    <div class="section-label">🎨 Warna krim</div>
    <div class="palette" id="colors"></div>

    <div class="section-label">✨ Pilih hiasan, lalu ketuk cupcake</div>
    <div class="palette" id="tools"></div>

    <div class="controls">
      <button class="btn speak" id="surpriseBtn">🎲 Hias Acak</button>
      <button class="btn clear" id="clearBtn">🧹 Hapus Hiasan</button>
      <button class="btn done" id="doneBtn">Selesai! 🎉</button>
    </div>
  </div>
</div>

<div id="overlay">
  <h2 id="ovTitle">Cupcake Cantik! 🎉</h2>
  <p id="ovText">Cupcake unicorn kamu enak banget kelihatannya!</p>
  <button class="btn done" id="againBtn">Buat Lagi 🧁</button>
</div>

<script>
(() => {
  const stage   = document.getElementById('stage');
  const colorsEl= document.getElementById('colors');
  const toolsEl = document.getElementById('tools');
  const hintEl  = document.getElementById('hint');
  const countEl = document.getElementById('count');
  const overlay = document.getElementById('overlay');
  const ovText  = document.getElementById('ovText');
  const ovTitle = document.getElementById('ovTitle');
  const frosting= document.querySelectorAll('.frosting circle');

  const COLORS = ['#f48fb1','#ce93d8','#90caf9','#a5d6a7','#fff59d','#ffcc80','#80deea','#f8bbd0'];
  const TOOLS  = ['⭐','🌈','💖','🍓','🍬','🌸','🦋','🫐','🍫','✨'];

  let count = 0;
  let frostColor = COLORS[0];
  let tool = TOOLS[0];

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.3; u.lang = 'id-ID';
    window.speechSynthesis.speak(u);
  }

  // Swatch warna
  COLORS.forEach((c, i) => {
    const s = document.createElement('div');
    s.className = 'swatch' + (i === 0 ? ' sel' : '');
    s.style.background = c;
    s.addEventListener('click', () => {
      frostColor = c;
      frosting.forEach(circ => circ.setAttribute('fill', c));
      colorsEl.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
      s.classList.add('sel');
      hintEl.textContent = 'Warna krim cantik! Sekarang pilih hiasan ✨';
    });
    colorsEl.appendChild(s);
  });

  // Tombol hiasan
  TOOLS.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'tool' + (i === 0 ? ' sel' : '');
    b.textContent = t;
    b.addEventListener('click', () => {
      tool = t;
      toolsEl.querySelectorAll('.tool').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      hintEl.textContent = 'Ketuk cupcake untuk menabur ' + t;
    });
    toolsEl.appendChild(b);
  });

  function addDeco(xPct, yPct, emoji) {
    const d = document.createElement('div');
    d.className = 'deco';
    d.textContent = emoji;
    d.style.left = xPct + '%';
    d.style.top  = yPct + '%';
    d.style.fontSize = (22 + Math.random() * 14) + 'px';
    stage.appendChild(d);
  }

  function placeAt(clientX, clientY) {
    const r = stage.getBoundingClientRect();
    const xPct = ((clientX - r.left) / r.width) * 100;
    const yPct = ((clientY - r.top) / r.height) * 100;
    // hanya taruh di area krim (bagian atas cupcake)
    if (yPct < 22 || yPct > 70) {
      hintEl.textContent = 'Taburkan hiasan di krimnya ya! 🍥';
      return;
    }
    addDeco(xPct, yPct, tool);
  }

  stage.addEventListener('click', e => placeAt(e.clientX, e.clientY));
  stage.addEventListener('touchstart', e => {
    if (e.touches[0]) { placeAt(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });

  document.getElementById('clearBtn').addEventListener('click', () => {
    stage.querySelectorAll('.deco').forEach(d => d.remove());
    hintEl.textContent = 'Cupcake bersih lagi! Ayo hias ulang ✨';
  });

  document.getElementById('surpriseBtn').addEventListener('click', () => {
    const n = 6 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const emoji = TOOLS[Math.floor(Math.random() * TOOLS.length)];
      const xPct = 28 + Math.random() * 44;
      const yPct = 28 + Math.random() * 36;
      addDeco(xPct, yPct, emoji);
    }
    hintEl.textContent = 'Taburan ajaib! ✨🌈';
    speak('Taburan ajaib!');
  });

  document.getElementById('doneBtn').addEventListener('click', () => {
    count++;
    countEl.textContent = count;
    const decoCount = stage.querySelectorAll('.deco').length;
    ovTitle.textContent = decoCount >= 5 ? 'Wah, Cantik Sekali! 🎉' : 'Cupcake Lucu! 🧁';
    ovText.textContent = 'Cece membuat cupcake unicorn dengan ' + decoCount + ' hiasan! 🦄✨';
    overlay.classList.add('show');
    for (let k = 0; k < 4; k++) setTimeout(burstConfetti, k * 350);
    speak('Hore! Cupcake unicorn Cece sudah jadi!');
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    overlay.classList.remove('show');
    stage.querySelectorAll('.deco').forEach(d => d.remove());
    hintEl.textContent = 'Buat cupcake baru! Pilih warna krim dulu 🎨';
  });

  function burstConfetti() {
    const colors = ['#ff5252','#ffeb3b','#4caf50','#2196f3','#e040fb','#ff9800'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }
})();
</script>
</body>
</html>
