<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cookie Catcher!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, #f4e4bc 100%);
    user-select: none;
    touch-action: none;
  }
  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: none;
  }
  #ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(180deg, #8bc34a 0%, #689f38 100%);
    border-top: 6px solid #558b2f;
    z-index: 1;
  }
  .cloud {
    position: absolute;
    background: white;
    border-radius: 100px;
    opacity: 0.9;
  }
  #hud {
    position: absolute;
    top: 16px; left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    pointer-events: none;
  }
  .panel {
    background: rgba(255,255,255,0.85);
    border: 4px solid #ff8a65;
    border-radius: 20px;
    padding: 10px 22px;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: bold;
    color: #5d4037;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }
  .panel .label { font-size: 0.6em; color: #8d6e63; display: block; }
  #basket {
    position: absolute;
    bottom: 60px;
    width: 130px;
    height: 90px;
    z-index: 5;
    transition: transform 0.05s linear;
    will-change: left;
  }
  .falling {
    position: absolute;
    font-size: 60px;
    z-index: 3;
    user-select: none;
    will-change: transform;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2));
  }
  .pop {
    position: absolute;
    font-size: 40px;
    font-weight: bold;
    z-index: 9;
    pointer-events: none;
    animation: popUp 0.8s ease-out forwards;
    color: #ff5722;
    text-shadow: 2px 2px 0 white, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white;
  }
  @keyframes popUp {
    0%   { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: clamp(40px, 9vw, 90px);
    color: #fff8e1;
    text-shadow: 4px 4px 0 #d84315, 8px 8px 0 rgba(0,0,0,0.2);
    margin-bottom: 14px;
  }
  #overlay p {
    font-size: clamp(18px, 3.5vw, 28px);
    margin-bottom: 10px;
    max-width: 600px;
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    border-radius: 16px;
  }
  #startBtn {
    margin-top: 20px;
    font-family: inherit;
    font-size: clamp(28px, 6vw, 48px);
    background: #ffeb3b;
    color: #5d4037;
    border: 6px solid #fbc02d;
    border-radius: 30px;
    padding: 18px 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #f57f17, 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  #startBtn:hover { transform: scale(1.05); }
  #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #f57f17; }
  .hidden { display: none !important; }
  .hearts { font-size: clamp(22px, 4vw, 30px); letter-spacing: 4px; }
  #flash {
    position: absolute;
    inset: 0;
    background: red;
    opacity: 0;
    z-index: 15;
    pointer-events: none;
  }
  #flash.show { animation: flashAnim 0.3s; }
  @keyframes flashAnim {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div id="game">
  <div class="cloud" style="top: 8%; left: 10%; width: 120px; height: 40px;"></div>
  <div class="cloud" style="top: 18%; left: 60%; width: 160px; height: 50px;"></div>
  <div class="cloud" style="top: 5%; left: 75%; width: 100px; height: 35px;"></div>

  <div id="hud">
    <div class="panel"><span class="label">Cookies</span><span id="score">0</span></div>
    <div class="panel"><span class="label">Lives</span><span id="lives" class="hearts">❤️❤️❤️</span></div>
  </div>

  <div id="ground"></div>

  <div id="basket">
    <svg viewBox="0 0 130 90" width="130" height="90">
      <ellipse cx="65" cy="20" rx="60" ry="12" fill="#6d4c41" stroke="#3e2723" stroke-width="3"/>
      <path d="M 8 22 L 22 85 Q 65 95 108 85 L 122 22 Z"
            fill="#a1887f" stroke="#3e2723" stroke-width="3"/>
      <line x1="25" y1="30" x2="32" y2="82" stroke="#3e2723" stroke-width="2"/>
      <line x1="45" y1="30" x2="48" y2="85" stroke="#3e2723" stroke-width="2"/>
      <line x1="65" y1="30" x2="65" y2="86" stroke="#3e2723" stroke-width="2"/>
      <line x1="85" y1="30" x2="82" y2="85" stroke="#3e2723" stroke-width="2"/>
      <line x1="105" y1="30" x2="98" y2="82" stroke="#3e2723" stroke-width="2"/>
      <ellipse cx="65" cy="22" rx="58" ry="8" fill="#8d6e63" stroke="#3e2723" stroke-width="2"/>
    </svg>
  </div>

  <div id="flash"></div>

  <div id="overlay">
    <h1>🍪 Cookie Catcher! 🍪</h1>
    <p>Move the basket to catch yummy cookies! 🍪🍪🍪</p>
    <p>Watch out for broccoli! 🥦 (Yuck!)</p>
    <p>Use ← → arrow keys, mouse, or your finger!</p>
    <button id="startBtn">Let's Play!</button>
  </div>
</div>

<script>
(() => {
  const game     = document.getElementById('game');
  const basket   = document.getElementById('basket');
  const scoreEl  = document.getElementById('score');
  const livesEl  = document.getElementById('lives');
  const overlay  = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const flash    = document.getElementById('flash');

  const COOKIES = ['🍪', '🍪', '🍪', '🍩', '🧁', '🎂'];
  const BAD     = ['🥦', '🥬', '🫑'];
  const BASKET_W = 130;
  const BASKET_H = 90;

  let state = {
    running: false,
    score: 0,
    lives: 3,
    basketX: 0,
    items: [],
    spawnTimer: 0,
    spawnRate: 1100,
    fallSpeed: 180,  // px / sec
    lastTime: 0,
  };

  function getW() { return window.innerWidth;  }
  function getH() { return window.innerHeight; }

  function placeBasket(x) {
    const w = getW();
    state.basketX = Math.max(0, Math.min(w - BASKET_W, x - BASKET_W / 2));
    basket.style.left = state.basketX + 'px';
  }

  function spawnItem() {
    const isBad = Math.random() < 0.22;
    const symbol = isBad
      ? BAD[Math.floor(Math.random() * BAD.length)]
      : COOKIES[Math.floor(Math.random() * COOKIES.length)];
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = symbol;
    const x = Math.random() * (getW() - 60);
    el.style.left = x + 'px';
    el.style.top  = '-60px';
    game.appendChild(el);
    state.items.push({ el, x, y: -60, bad: isBad, w: 60, h: 60 });
  }

  function popText(text, x, y, color) {
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = text;
    p.style.left = x + 'px';
    p.style.top  = y + 'px';
    if (color) p.style.color = color;
    game.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function updateHud() {
    scoreEl.textContent = state.score;
    livesEl.textContent = state.lives > 0 ? '❤️'.repeat(state.lives) : '💔';
  }

  function loseLife(x, y) {
    state.lives--;
    updateHud();
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
    popText('Yuck!', x, y, '#4caf50');
    if (state.lives <= 0) gameOver();
  }

  function gameOver() {
    state.running = false;
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>${state.score >= 20 ? '🎉 Yummy! 🎉' : 'Good Try!'}</h1>
      <p>You caught <strong>${state.score}</strong> cookies! 🍪</p>
      <button id="startBtn">Play Again!</button>
    `;
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function startGame() {
    state.running = true;
    state.score = 0;
    state.lives = 3;
    state.items.forEach(i => i.el.remove());
    state.items = [];
    state.spawnTimer = 0;
    state.spawnRate = 1100;
    state.fallSpeed = 180;
    state.lastTime = performance.now();
    updateHud();
    overlay.classList.add('hidden');
    placeBasket(getW() / 2);
    requestAnimationFrame(loop);
  }

  function loop(time) {
    if (!state.running) return;
    const dt = Math.min(50, time - state.lastTime);
    state.lastTime = time;

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnRate) {
      state.spawnTimer = 0;
      spawnItem();
      // ramp up difficulty slowly — gentle for kids
      state.spawnRate = Math.max(550, state.spawnRate - 12);
      state.fallSpeed = Math.min(360, state.fallSpeed + 3);
    }

    const H = getH();
    const basketTop    = H - 60 - BASKET_H + 20; // top edge of basket opening
    const basketLeft   = state.basketX + 10;
    const basketRight  = state.basketX + BASKET_W - 10;

    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      it.y += state.fallSpeed * dt / 1000;
      it.el.style.transform = `translateY(${it.y + 60}px)`;

      // catch check — when item's center crosses basket opening
      const itemCx = it.x + it.w / 2;
      const itemCy = it.y + it.h / 2;
      if (itemCy >= basketTop && itemCy <= basketTop + 40 &&
          itemCx >= basketLeft && itemCx <= basketRight) {
        if (it.bad) {
          loseLife(it.x, it.y);
        } else {
          state.score++;
          updateHud();
          popText('+1', it.x, it.y, '#ff5722');
        }
        it.el.remove();
        state.items.splice(i, 1);
        continue;
      }

      // off-screen bottom
      if (it.y > H) {
        if (!it.bad) {
          // missed cookie — small penalty, but kid-friendly: no life loss
          popText('oops', it.x, H - 140, '#888');
        }
        it.el.remove();
        state.items.splice(i, 1);
      }
    }

    requestAnimationFrame(loop);
  }

  // input
  let keys = { left: false, right: false };
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a')  keys.left  = true;
    if (e.key === 'ArrowRight'|| e.key === 'd')  keys.right = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a')  keys.left  = false;
    if (e.key === 'ArrowRight'|| e.key === 'd')  keys.right = false;
  });
  function keyboardMove() {
    if (state.running) {
      const speed = 8;
      let cx = state.basketX + BASKET_W / 2;
      if (keys.left)  cx -= speed;
      if (keys.right) cx += speed;
      placeBasket(cx);
    }
    requestAnimationFrame(keyboardMove);
  }
  keyboardMove();

  game.addEventListener('mousemove', e => {
    if (state.running) placeBasket(e.clientX);
  });
  game.addEventListener('touchmove', e => {
    if (state.running && e.touches[0]) {
      placeBasket(e.touches[0].clientX);
      e.preventDefault();
    }
  }, { passive: false });
  game.addEventListener('touchstart', e => {
    if (state.running && e.touches[0]) placeBasket(e.touches[0].clientX);
  }, { passive: true });

  window.addEventListener('resize', () => placeBasket(state.basketX + BASKET_W / 2));

  startBtn.addEventListener('click', startGame);
  placeBasket(getW() / 2);
})();
</script>
</body>
</html>
