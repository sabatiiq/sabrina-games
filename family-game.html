<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bear's Family!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    background: linear-gradient(135deg, #ffd3a5 0%, #fd9853 40%, #ffafbd 100%);
    user-select: none;
    overflow-x: hidden;
  }
  body { padding: 20px; min-height: 100vh; }
  #app { max-width: 900px; margin: 0 auto; }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 10px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    background: rgba(255,255,255,0.9);
    border: 4px solid #ff7043;
    border-radius: 30px;
    padding: 8px 20px;
    font-size: clamp(16px, 2.8vw, 24px);
    font-weight: bold;
    color: #5d4037;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  /* Main card */
  .stage {
    background: #fffaf0;
    border-radius: 24px;
    box-shadow:
      0 0 0 8px #fff,
      0 0 0 14px #ec407a,
      0 20px 40px rgba(0,0,0,0.3);
    padding: 24px;
    position: relative;
    min-height: 520px;
  }

  /* Family member showcase */
  .member-card {
    background: linear-gradient(180deg, #fce4ec 0%, #fff9c4 70%, #c5e1a5 100%);
    border: 4px dashed #ec407a;
    border-radius: 20px;
    padding: 20px 10px;
    margin-bottom: 16px;
    text-align: center;
  }
  .member-emoji {
    font-size: clamp(90px, 18vw, 150px);
    line-height: 1.1;
    margin-bottom: 6px;
    animation: bobble 2s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bobble {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-8px) rotate(2deg); }
  }
  .member-name {
    font-size: clamp(28px, 5.5vw, 42px);
    font-weight: bold;
    color: #c2185b;
    text-shadow: 2px 2px 0 #fff;
  }
  .prompt {
    font-size: clamp(20px, 3.6vw, 28px);
    color: #4e342e;
    margin-top: 8px;
  }
  .prompt b { color: #d84315; }

  .feedback {
    text-align: center;
    font-size: clamp(20px, 3.8vw, 28px);
    font-weight: bold;
    min-height: 36px;
    margin-bottom: 10px;
    color: #2e7d32;
  }

  /* Item choices */
  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .choice {
    font-family: inherit;
    font-size: clamp(48px, 11vw, 80px);
    background: #fff3e0;
    border: 5px solid #ff9800;
    border-radius: 20px;
    padding: 18px 6px;
    cursor: pointer;
    box-shadow: 0 6px 0 #f57c00;
    transition: transform 0.1s;
    line-height: 1;
  }
  .choice:hover  { transform: scale(1.05); }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 #f57c00; }
  .choice.right  { background: #c8e6c9; border-color: #4caf50; box-shadow: 0 6px 0 #2e7d32; animation: shake 0.4s; }
  .choice.wrong  { background: #ffcdd2; border-color: #e53935; box-shadow: 0 6px 0 #c62828; animation: nope 0.4s; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-5deg) scale(1.1); }
    75%      { transform: rotate(5deg)  scale(1.1); }
  }
  @keyframes nope {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-8px); }
    75%      { transform: translateX(8px); }
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: inherit;
    font-size: clamp(18px, 3.2vw, 24px);
    font-weight: bold;
    border-radius: 24px;
    padding: 12px 22px;
    cursor: pointer;
    border: 4px solid;
    box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn.listen { background: #bbdefb; border-color: #1976d2; color: #0d47a1; }
  .btn.next   { background: #ffeb3b; border-color: #fbc02d; color: #5d4037; }
  .btn.next[disabled] { opacity: 0.4; cursor: not-allowed; }
  .btn.home   { background: #fff; border-color: #ff7043; color: #d84315; text-decoration: none; display: inline-block; }

  /* End screen */
  #endScreen {
    display: none;
    text-align: center;
    padding: 16px 6px;
  }
  #endScreen.show { display: block; }
  #endScreen h1 {
    font-size: clamp(34px, 7vw, 60px);
    color: #c2185b;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.1);
    margin-bottom: 16px;
  }
  .family-hug {
    font-size: clamp(50px, 12vw, 100px);
    line-height: 1.1;
    margin: 14px 0 20px;
    letter-spacing: -10px;
    animation: hug 1.6s ease-in-out infinite;
  }
  @keyframes hug {
    0%, 100% { transform: scale(1) rotate(0); }
    50%      { transform: scale(1.06) rotate(-1deg); }
  }
  .star-row {
    font-size: clamp(40px, 8vw, 60px);
    margin: 10px 0 20px;
    letter-spacing: 6px;
  }
  .star-row .star {
    display: inline-block;
    animation: pop 0.6s backwards;
  }
  @keyframes pop {
    0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0);       opacity: 1; }
  }
  .end-msg {
    font-size: clamp(18px, 3.6vw, 26px);
    color: #4e342e;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .end-buttons {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* Floating hearts */
  .heart-float {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    opacity: 0.5;
    animation: heartUp 6s linear forwards;
    z-index: 100;
  }
  @keyframes heartUp {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    20%  { opacity: 0.7; }
    100% { transform: translateY(-90vh) scale(1.2); opacity: 0; }
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 12px; height: 12px;
    top: -20px;
    pointer-events: none;
    z-index: 100;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <a class="badge" href="index.html" style="text-decoration:none;">🏠 Home</a>
    <div class="badge">👨‍👩‍👧‍👦 <span id="roundNum">1</span> / <span id="roundTotal">6</span></div>
    <div class="badge">⭐ <span id="stars">0</span></div>
  </div>

  <div class="stage" id="stage">
    <div id="round">
      <div class="member-card">
        <div class="member-emoji" id="memberEmoji">🐻</div>
        <div class="member-name" id="memberName">Bear</div>
        <div class="prompt" id="prompt">Pick what they need!</div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices"></div>
      <div class="controls">
        <button class="btn listen" id="listenBtn">🔊 Say it again</button>
        <button class="btn next" id="nextBtn" disabled>Next ➡️</button>
      </div>
    </div>

    <div id="endScreen">
      <h1>🎉 Family Hug! 🎉</h1>
      <div class="family-hug">🐻👵🐻🍼🎀🐶</div>
      <div class="star-row" id="finalStars"></div>
      <p class="end-msg" id="endMsg">You helped the whole bear family! What a great helper!</p>
      <div class="end-buttons">
        <button class="btn next" id="restartBtn">Play Again 🐻</button>
        <a class="btn home" href="index.html">🏠 Home</a>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // The bear family + what each member wants
  const family = [
    {
      emoji: '🐻',
      name: 'Mama Bear',
      want: '☕',
      wantWord: 'coffee',
      promptVerb: 'wants her morning'
    },
    {
      emoji: '🐻',
      name: 'Papa Bear',
      want: '📰',
      wantWord: 'newspaper',
      promptVerb: 'wants to read his'
    },
    {
      emoji: '👶',
      name: 'Baby Bear',
      want: '🍼',
      wantWord: 'bottle',
      promptVerb: 'is hungry — give them a'
    },
    {
      emoji: '🧒',
      name: 'Big Sister Bear',
      want: '🎀',
      wantWord: 'ribbon',
      promptVerb: 'wants her pretty pink'
    },
    {
      emoji: '👵',
      name: 'Grandma Bear',
      want: '👓',
      wantWord: 'glasses',
      promptVerb: 'is looking for her'
    },
    {
      emoji: '🐶',
      name: 'Doggy',
      want: '🦴',
      wantWord: 'bone',
      promptVerb: 'wants a yummy'
    }
  ];

  // Extra distractor items (things no family member wants in this round)
  const extras = ['🥦','🧦','🪣','🧹','🎈','🍋','🪀','🧸'];

  const memberEmoji = document.getElementById('memberEmoji');
  const memberName  = document.getElementById('memberName');
  const promptEl    = document.getElementById('prompt');
  const choicesEl   = document.getElementById('choices');
  const feedbackEl  = document.getElementById('feedback');
  const nextBtn     = document.getElementById('nextBtn');
  const listenBtn   = document.getElementById('listenBtn');
  const roundNumEl  = document.getElementById('roundNum');
  const roundTotEl  = document.getElementById('roundTotal');
  const starsEl     = document.getElementById('stars');
  const endScreen   = document.getElementById('endScreen');
  const roundEl     = document.getElementById('round');
  const finalStars  = document.getElementById('finalStars');
  const endMsg      = document.getElementById('endMsg');
  const restartBtn  = document.getElementById('restartBtn');

  let order = [];
  let current = 0;
  let stars = 0;
  let solved = false;

  roundTotEl.textContent = family.length;

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    u.pitch = 1.15;
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildRound(memberIdx) {
    solved = false;
    const member = family[memberIdx];

    memberEmoji.textContent = member.emoji;
    memberName.textContent  = member.name;
    promptEl.innerHTML = `${member.name} ${member.promptVerb} <b>${member.wantWord}</b>!`;
    feedbackEl.textContent = '';
    nextBtn.disabled = true;
    nextBtn.textContent = memberIdx === family.length - 1 ? 'Family Hug! 🤗' : 'Next ➡️';

    // Build choices: correct + 2 distractors (from other family wants OR extras)
    const otherWants = family.filter((_, i) => i !== memberIdx).map(f => f.want);
    const distractorPool = shuffle(otherWants.concat(extras));
    const distractors = distractorPool.slice(0, 2);
    const items = shuffle([member.want, ...distractors]);

    choicesEl.innerHTML = '';
    items.forEach(item => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = item;
      b.setAttribute('aria-label', item === member.want ? member.wantWord : 'item');
      b.addEventListener('click', () => handlePick(b, item, member));
      choicesEl.appendChild(b);
    });

    // Speak after a small pause so the UI is visible first
    setTimeout(() => speak(`${member.name} ${member.promptVerb} ${member.wantWord}!`), 250);
  }

  function handlePick(btn, item, member) {
    if (solved) return;
    if (item === member.want) {
      solved = true;
      btn.classList.add('right');
      feedbackEl.style.color = '#2e7d32';
      feedbackEl.textContent = `🌟 Yay! ${member.name} loves it! 🌟`;
      stars++;
      starsEl.textContent = stars;
      nextBtn.disabled = false;
      choicesEl.querySelectorAll('.choice').forEach(c => c.style.pointerEvents = 'none');
      burstConfetti();
      floatHearts(8);
      speak(`Yes! ${member.wantWord}!`);
    } else {
      btn.classList.add('wrong');
      feedbackEl.style.color = '#d84315';
      feedbackEl.textContent = `🤔 Try again — find the ${member.wantWord}!`;
      setTimeout(() => btn.classList.remove('wrong'), 600);
      speak(`Oops! Find the ${member.wantWord}.`);
    }
  }

  function nextRound() {
    current++;
    if (current >= order.length) {
      showEnd();
      return;
    }
    roundNumEl.textContent = current + 1;
    buildRound(order[current]);
  }

  function showEnd() {
    roundEl.style.display = 'none';
    endScreen.classList.add('show');
    finalStars.innerHTML = '';
    for (let i = 0; i < stars; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      s.textContent = '⭐';
      s.style.animationDelay = (i * 0.15) + 's';
      finalStars.appendChild(s);
    }
    endMsg.textContent = stars === family.length
      ? 'You helped EVERY bear in the family! Big family hug for you!'
      : 'You helped the bear family! Such a kind helper!';
    bigCelebration();
    setTimeout(() => speak('Family hug! You helped the whole bear family!'), 300);
  }

  function burstConfetti() {
    const colors = ['#ff5252','#ffeb3b','#4caf50','#2196f3','#e040fb','#ff9800','#ec407a'];
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  function floatHearts(n) {
    const hearts = ['❤️','💖','💕','💗','💘'];
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = hearts[i % hearts.length];
      h.style.left = (10 + Math.random() * 80) + 'vw';
      h.style.bottom = '0';
      h.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }
  }

  function bigCelebration() {
    for (let k = 0; k < 4; k++) {
      setTimeout(burstConfetti, k * 350);
      setTimeout(() => floatHearts(6), k * 400);
    }
  }

  function start() {
    stars = 0;
    current = 0;
    starsEl.textContent = 0;
    roundNumEl.textContent = 1;
    endScreen.classList.remove('show');
    roundEl.style.display = 'block';
    // Randomize order of family members each play so it stays fresh
    order = shuffle(family.map((_, i) => i));
    buildRound(order[0]);
  }

  nextBtn.addEventListener('click', nextRound);
  listenBtn.addEventListener('click', () => {
    const m = family[order[current]];
    speak(`${m.name} ${m.promptVerb} ${m.wantWord}!`);
  });
  restartBtn.addEventListener('click', start);

  start();
})();
</script>
</body>
</html>
